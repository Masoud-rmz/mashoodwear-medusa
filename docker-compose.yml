services:
  mysql:
    image: mysql:8.0
    container_name: mashoodwear-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mashoodwear
      MYSQL_USER: mashoodwear
      MYSQL_PASSWORD: mashoodwear_dev
    volumes:
      - mashoodwear_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: mashoodwear-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_dev
      POSTGRES_DB: medusa_store
    volumes:
      - mashoodwear_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mashoodwear-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mashoodwear_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mashoodwear_mysql_data:
  mashoodwear_postgres_data:
  mashoodwear_redis_data:
